<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fools Gold</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        function applyInsets() {
          var probe = document.createElement('div');
          probe.style.cssText = 'position:fixed;top:0;left:0;width:env(safe-area-inset-left,0px);height:env(safe-area-inset-top,0px);pointer-events:none;visibility:hidden;z-index:-1';
          document.body.appendChild(probe);
          var rect = probe.getBoundingClientRect();
          var envTop = rect.height;
          var envLeft = rect.width;
          probe.remove();

          var w = window.screen.width, h = window.screen.height;
          var long = Math.max(w, h), short = Math.min(w, h);
          var isNotchPhone = long >= 812 && (long / short) > 1.9;
          var isPortrait = window.innerHeight > window.innerWidth;

          var sat = envTop  > 0 ? envTop  : (isNotchPhone && isPortrait  ? 59 : 0);
          var sab = envTop  > 0 ? 21      : (isNotchPhone ? 21 : 0);
          var sal = envLeft > 0 ? envLeft : (isNotchPhone && !isPortrait ? 59 : 0);
          var sar = 0;

          var root = document.documentElement;
          root.style.setProperty('--sat', sat + 'px');
          root.style.setProperty('--sab', sab + 'px');
          root.style.setProperty('--sal', sal + 'px');
          root.style.setProperty('--sar', sar + 'px');
          root.style.setProperty('--hud-offset', 'calc(' + sat + 'px + 52px)');
          root.style.setProperty('--left-inset', 'calc(' + sal + 'px + 6px)');
        }

        if (document.body) { applyInsets(); }
        else { document.addEventListener('DOMContentLoaded', applyInsets); }
        window.addEventListener('orientationchange', function() { setTimeout(applyInsets, 300); });
        window.addEventListener('resize', applyInsets);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="portal-root" style="position:fixed;inset:0;pointer-events:none;z-index:9000;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
